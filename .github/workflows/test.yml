name: Test public KNOWITALL utilities

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax validation
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Verify offline quickstart
        run: npm run demo
